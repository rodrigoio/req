name: ci

# Runs `make lint` and `make test` (the same targets as `make check`) on the machine, no container:
# the guideline forbids docker for tests, and the runner is a plain VM like the development one.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install the development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --version
      - name: Lint
        run: make lint

  test:
    name: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install the runtime and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends curl jq openssl python3
      - name: Test
        run: make test
